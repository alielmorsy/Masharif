<!doctype html>
<html><head><meta charset="utf-8"><title>box_model_border_padding</title>
<style>
  * { box-sizing: content-box; margin: 0; padding: 0; border: 0 none; }
  html,body { background:#f4f4f6; }
  body { padding: 24px; font-family: system-ui, sans-serif; }
  h1 { font: 600 14px/1.4 system-ui, sans-serif; color:#333; margin-bottom:12px !important; }
  .stage-label { font: 12px/1.4 monospace; color:#888; margin-bottom:8px !important; }
</style>
</head><body>
<h1>Content-box model: border + padding nesting</h1>
<div class="stage-label"></div>
<div data-id="root" style="display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;align-content:stretch;box-sizing:content-box;width:300px;height:160px;min-width:0px;min-height:0px;margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;padding-top:15px;padding-right:15px;padding-bottom:15px;padding-left:15px;border-top-width:6px;border-top-style:solid;border-right-width:6px;border-right-style:solid;border-bottom-width:6px;border-bottom-style:solid;border-left-width:6px;border-left-style:solid;border-color:rgba(0,0,0,0.35);position:static;background:#e1f5fe;overflow:hidden;"><div data-id="inner" style="display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;align-content:stretch;box-sizing:content-box;width:100px;height:80px;min-width:0px;min-height:0px;margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;padding-top:8px;padding-right:8px;padding-bottom:8px;padding-left:8px;border-top-width:3px;border-top-style:solid;border-right-width:3px;border-right-style:solid;border-bottom-width:3px;border-bottom-style:solid;border-left-width:3px;border-left-style:solid;border-color:rgba(0,0,0,0.35);position:static;background:#0288d1;overflow:hidden;color:#111;font:12px/1.3 system-ui,sans-serif;align-items:stretch;justify-content:flex-start;">inner</div></div>
</body></html>
