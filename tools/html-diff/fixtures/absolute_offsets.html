<!doctype html>
<html><head><meta charset="utf-8"><title>absolute_offsets</title>
<style>
  * { box-sizing: content-box; margin: 0; padding: 0; border: 0 none; }
  html,body { background:#f4f4f6; }
  body { padding: 24px; font-family: system-ui, sans-serif; }
  h1 { font: 600 14px/1.4 system-ui, sans-serif; color:#333; margin-bottom:12px !important; }
  .stage-label { font: 12px/1.4 monospace; color:#888; margin-bottom:8px !important; }
</style>
</head><body>
<h1>position:absolute with mixed top/right/bottom/left offsets</h1>
<div class="stage-label"></div>
<div data-id="root" style="display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;align-content:stretch;box-sizing:content-box;width:320px;height:220px;min-width:0px;min-height:0px;margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px;border-top-width:0px;border-top-style:none;border-right-width:0px;border-right-style:none;border-bottom-width:0px;border-bottom-style:none;border-left-width:0px;border-left-style:none;position:relative;background:#fce4ec;overflow:hidden;"><div data-id="tl" style="display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;align-content:stretch;box-sizing:content-box;width:60px;height:40px;min-width:0px;min-height:0px;margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px;border-top-width:0px;border-top-style:none;border-right-width:0px;border-right-style:none;border-bottom-width:0px;border-bottom-style:none;border-left-width:0px;border-left-style:none;position:absolute;top:10px;left:10px;background:#d81b60;overflow:hidden;color:#111;font:12px/1.3 system-ui,sans-serif;align-items:stretch;justify-content:flex-start;">TL</div>
<div data-id="br" style="display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;align-content:stretch;box-sizing:content-box;width:60px;height:40px;min-width:0px;min-height:0px;margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px;border-top-width:0px;border-top-style:none;border-right-width:0px;border-right-style:none;border-bottom-width:0px;border-bottom-style:none;border-left-width:0px;border-left-style:none;position:absolute;right:10px;bottom:10px;background:#ad1457;overflow:hidden;color:#111;font:12px/1.3 system-ui,sans-serif;align-items:stretch;justify-content:flex-start;">BR</div>
<div data-id="centerish" style="display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;align-content:stretch;box-sizing:content-box;width:auto;height:auto;min-width:0px;min-height:0px;margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px;border-top-width:0px;border-top-style:none;border-right-width:0px;border-right-style:none;border-bottom-width:0px;border-bottom-style:none;border-left-width:0px;border-left-style:none;position:absolute;top:25%;right:25%;bottom:25%;left:25%;background:#f06292;overflow:hidden;color:#111;font:12px/1.3 system-ui,sans-serif;align-items:stretch;justify-content:flex-start;">stretch-inset</div></div>
</body></html>
