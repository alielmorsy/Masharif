<!doctype html>
<html><head><meta charset="utf-8"><title>margin_auto_centering</title>
<style>
  * { box-sizing: content-box; margin: 0; padding: 0; border: 0 none; }
  html,body { background:#f4f4f6; }
  body { padding: 24px; font-family: system-ui, sans-serif; }
  h1 { font: 600 14px/1.4 system-ui, sans-serif; color:#333; margin-bottom:12px !important; }
  .stage-label { font: 12px/1.4 monospace; color:#888; margin-bottom:8px !important; }
</style>
</head><body>
<h1>margin:auto centering inside a flex row</h1>
<div class="stage-label"></div>
<div data-id="root" style="display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;align-content:stretch;box-sizing:content-box;width:300px;height:150px;min-width:0px;min-height:0px;margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px;border-top-width:0px;border-top-style:none;border-right-width:0px;border-right-style:none;border-bottom-width:0px;border-bottom-style:none;border-left-width:0px;border-left-style:none;position:static;background:#e0f7fa;overflow:hidden;"><div data-id="box" style="display:flex;flex-direction:row;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;align-content:stretch;box-sizing:content-box;width:100px;height:60px;min-width:0px;min-height:0px;margin-top:auto;margin-right:auto;margin-bottom:auto;margin-left:auto;padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px;border-top-width:0px;border-top-style:none;border-right-width:0px;border-right-style:none;border-bottom-width:0px;border-bottom-style:none;border-left-width:0px;border-left-style:none;position:static;background:#00838f;overflow:hidden;color:#111;font:12px/1.3 system-ui,sans-serif;align-items:stretch;justify-content:flex-start;">centered</div></div>
</body></html>
